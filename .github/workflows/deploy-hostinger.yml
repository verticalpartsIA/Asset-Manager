name: Deploy Hostinger — Asset Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Hospedagem COMPARTILHADA Hostinger (estática/PHP) — NÃO é Node/Passenger.
# O app é um site estático (HTML + JS + cliente Supabase no browser). O deploy
# só publica o CONTEÚDO de public/ no public_html do domínio. server.js é
# usado apenas em desenvolvimento local e não vai para produção.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # version.json gerado pelo MECANISMO DE DEPLOY REAL (este workflow) — é o
      # que o aviso de atualização do frontend consulta. Vai como arquivo
      # estático em public_html/version.json.
      - name: Gerar version.json
        run: |
          printf '{"commit":"%s","buildTime":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
          cat public/version.json

      # ── Deploy estático via SSH/SCP ─────────────────────────────────────
      # Secrets (Settings → Secrets and variables → Actions), do hPanel →
      # Avançado → Acesso SSH do site assetmanager.vpsistema.com:
      #   HOSTINGER_SSH_HOST / HOSTINGER_SSH_PORT / HOSTINGER_SSH_USER /
      #   HOSTINGER_SSH_PASSWORD / HOSTINGER_REMOTE_PATH (=.../public_html)
      # Sem secrets → deploy é pulado (workflow continua útil como CI).
      - name: Check deploy secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.HOSTINGER_SSH_HOST }}" ] && [ -n "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets HOSTINGER_* ausentes — pulando deploy."
          fi

      # Remove artefatos Node de deploys antigos que não pertencem a um docroot
      # estático (e não devem ficar expostos): server.js, package*.json,
      # node_modules e a antiga pasta public/ aninhada.
      - name: Limpar artefatos Node antigos
        if: steps.check_secrets.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            cd "${{ secrets.HOSTINGER_REMOTE_PATH }}" || exit 0
            rm -rf ./public ./node_modules ./server.js ./package.json ./package-lock.json ./tmp

      # Sobe o CONTEÚDO de public/ (index.html, vp-integration.js, boot-video.mp4,
      # version.json, .htaccess e a pasta "Asset Manager_files") direto no
      # public_html. strip_components:1 remove o prefixo "public/".
      - name: Deploy via SCP — tentativa 1
        id: scp1
        if: steps.check_secrets.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "public/*,public/.htaccess"
          target: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          strip_components: 1
          overwrite: true

      - name: Aguardar antes de repetir
        if: steps.check_secrets.outputs.configured == 'true' && steps.scp1.outcome == 'failure'
        run: sleep 20

      - name: Deploy via SCP — tentativa 2
        if: steps.check_secrets.outputs.configured == 'true' && steps.scp1.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "public/*,public/.htaccess"
          target: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          strip_components: 1
          overwrite: true
